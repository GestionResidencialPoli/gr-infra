{{- $svc := index .Values "notification-microservice" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-microservice
  namespace: {{ .Values.namespace }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: { app: notification-microservice }
  template:
    metadata:
      labels: { app: notification-microservice }
    spec:
      {{- with .Values.placement.backend.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: notification-microservice
          image: "{{ .Values.image.registry }}/gr-notification-microservice:{{ $svc.image.tag }}"
          ports:
            - containerPort: 4600
          env:
            - name: PORT
              value: "4600"
            - name: JWT_SECRET
              valueFrom: { secretKeyRef: { name: {{ .Values.existingSecret }}, key: JWT_SECRET } }
            - name: JWT_ENCRYPTION_KEY
              valueFrom: { secretKeyRef: { name: {{ .Values.existingSecret }}, key: JWT_ENCRYPTION_KEY } }
            - name: INTERNAL_SERVICE_TOKEN
              valueFrom: { secretKeyRef: { name: {{ .Values.existingSecret }}, key: INTERNAL_SERVICE_TOKEN } }
          resources:
            requests: { memory: {{ $svc.resources.requests.memory }} }
            limits: { memory: {{ $svc.resources.limits.memory }} }
          readinessProbe:
            httpGet: { path: /health, port: 4600 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: 4600 }
            initialDelaySeconds: 15
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: notification-microservice
  namespace: {{ .Values.namespace }}
spec:
  selector: { app: notification-microservice }
  ports:
    - port: 4600
