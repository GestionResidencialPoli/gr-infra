{{- if and .Values.nginx.enabled .Values.uis.enabled }}
{{- $domain := .Values.uis.ingress.domain }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx
  namespace: {{ .Values.namespace }}
data:
  backend-locations.conf: |
    location /api/ {
        proxy_pass http://gateway;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header X-Real-IP $client_ip;
        proxy_set_header X-Forwarded-For $client_ip;
        proxy_set_header X-Forwarded-Proto $client_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Origin "";
        proxy_set_header Referer "";
        proxy_buffering off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    location = /graphql {
        proxy_pass http://gateway/api/v1/finanzas/graphql;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_set_header X-Real-IP $client_ip;
        proxy_set_header X-Forwarded-For $client_ip;
        proxy_set_header X-Forwarded-Proto $client_proto;
        proxy_set_header Origin "";
        proxy_set_header Referer "";
    }
  proxy.conf: |
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header X-Real-IP $client_ip;
    proxy_set_header X-Forwarded-For $client_ip;
    proxy_set_header X-Forwarded-Proto $client_proto;
    proxy_set_header X-Forwarded-Host $host;
  nginx.conf: |
    worker_processes auto;
    pid /tmp/nginx.pid;

    events {
        worker_connections 1024;
    }

    http {
        include /etc/nginx/mime.types;
        access_log /dev/stdout;
        error_log /dev/stderr warn;

        sendfile on;
        server_tokens off;
        client_max_body_size 10m;
        server_names_hash_bucket_size 128;

        map $http_upgrade $connection_upgrade {
            default upgrade;
            "" "";
        }

        map $http_cf_connecting_ip $client_ip {
            default $http_cf_connecting_ip;
            "" $remote_addr;
        }

        map $http_x_forwarded_proto $client_proto {
            default $http_x_forwarded_proto;
            "" $scheme;
        }

        upstream gateway {
            server gateway:4000;
            keepalive 16;
        }

        server {
            listen 8080 default_server;
            server_name _;

            location = /healthz {
                access_log off;
                return 200 "ok";
            }

            location / {
                return 404;
            }
        }

        server {
            listen 8080;
            server_name {{ .Values.gateway.ingress.host }};

            location / {
                proxy_pass http://gateway;
                proxy_buffering off;
                proxy_read_timeout 1h;
                proxy_send_timeout 1h;
                include /etc/nginx/gr/proxy.conf;
            }
        }
        {{- range $name, $svc := .Values.uis.services }}

        server {
            listen 8080;
            server_name {{ $svc.host | default (printf "%s.%s" $name $domain) }};

            include /etc/nginx/gr/backend-locations.conf;

            location / {
                proxy_pass http://{{ $name }}:{{ $svc.port }};
                include /etc/nginx/gr/proxy.conf;
            }
        }
        {{- end }}
    }
{{- end }}
