{{- $svc := index .Values "contact-microservice" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: contact-microservice
  namespace: {{ .Values.namespace }}
spec:
  replicas: {{ $svc.replicas }}
  selector:
    matchLabels: { app: contact-microservice }
  template:
    metadata:
      labels: { app: contact-microservice }
    spec:
      containers:
        - name: contact-microservice
          image: "{{ .Values.image.registry }}/gr-contact-microservice:{{ $svc.image.tag }}"
          ports:
            - containerPort: 4500
          env:
            - name: PORT
              value: "4500"
            - name: DATABASE_URL
              value: "postgresql+psycopg://$(DB_USERNAME):$(DB_PASSWORD)@postgres:5432/gr_contact_db"
            - name: DB_USERNAME
              valueFrom: { secretKeyRef: { name: {{ .Values.existingSecret }}, key: DB_USERNAME } }
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ .Values.existingSecret }}, key: DB_PASSWORD } }
            - name: JWT_SECRET
              valueFrom: { secretKeyRef: { name: {{ .Values.existingSecret }}, key: JWT_SECRET } }
            - name: CORS_ALLOWED_ORIGINS
              valueFrom: { secretKeyRef: { name: {{ .Values.existingSecret }}, key: CORS_ALLOWED_ORIGINS } }
          resources:
            requests: { memory: {{ $svc.resources.requests.memory }} }
            limits: { memory: {{ $svc.resources.limits.memory }} }
          readinessProbe:
            httpGet: { path: /health/ready, port: 4500 }
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: 4500 }
            initialDelaySeconds: 20
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: contact-microservice
  namespace: {{ .Values.namespace }}
spec:
  selector: { app: contact-microservice }
  ports:
    - port: 4500
