{{- if .Values.uis.enabled }}
{{- range $name, $svc := .Values.uis.services }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  namespace: {{ $.Values.namespace }}
spec:
  replicas: {{ $.Values.uis.replicas | default 1 }}
  selector:
    matchLabels: { app: {{ $name }} }
  template:
    metadata:
      labels: { app: {{ $name }} }
    spec:
      {{- with $.Values.placement.frontend.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ $name }}
          image: "{{ $.Values.uis.image.registry }}/gr-{{ $name }}:{{ $.Values.uis.image.tag }}"
          imagePullPolicy: {{ $.Values.uis.image.pullPolicy }}
          ports:
            - containerPort: {{ $svc.port }}
          env:
            - name: PORT
              value: "{{ $svc.port }}"
            - name: BACKEND_API_URL
              value: "http://gateway:4000"
            {{- range $key, $value := $svc.extraEnv }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
          resources:
            requests: { memory: {{ $.Values.uis.resources.requests.memory }} }
            limits: { memory: {{ $.Values.uis.resources.limits.memory }} }
          readinessProbe:
            httpGet: { path: /, port: {{ $svc.port }} }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /, port: {{ $svc.port }} }
            initialDelaySeconds: 10
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  namespace: {{ $.Values.namespace }}
spec:
  selector: { app: {{ $name }} }
  ports:
    - port: {{ $svc.port }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $name }}
  namespace: {{ $.Values.namespace }}
spec:
  ingressClassName: nginx
  rules:
    - host: {{ $name }}.{{ $.Values.uis.ingress.domain }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $name }}
                port:
                  number: {{ $svc.port }}
{{- end }}
{{- end }}
