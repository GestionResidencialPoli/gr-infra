{{- $svc := index .Values "gate-microservice" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gate-microservice
  namespace: {{ .Values.namespace }}
spec:
  replicas: {{ $svc.replicas }}
  selector:
    matchLabels: { app: gate-microservice }
  template:
    metadata:
      labels: { app: gate-microservice }
    spec:
      initContainers:
        - name: migrate
          image: "{{ .Values.image.registry }}/gr-gate-microservice:migrate-{{ $svc.image.tag }}"
          env:
            - name: DB_HOST
              value: postgres
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              value: gr_gate_db
            - name: DB_USERNAME
              valueFrom: { secretKeyRef: { name: {{ .Values.existingSecret }}, key: DB_USERNAME } }
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ .Values.existingSecret }}, key: DB_PASSWORD } }
      containers:
        - name: gate-microservice
          image: "{{ .Values.image.registry }}/gr-gate-microservice:{{ $svc.image.tag }}"
          ports:
            - containerPort: 4300
          env:
            - name: NODE_ENV
              value: production
            - name: DB_HOST
              value: postgres
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              value: gr_gate_db
            - name: DB_USERNAME
              valueFrom: { secretKeyRef: { name: {{ .Values.existingSecret }}, key: DB_USERNAME } }
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ .Values.existingSecret }}, key: DB_PASSWORD } }
            - name: RABBITMQ_DEFAULT_USER
              valueFrom: { secretKeyRef: { name: {{ .Values.existingSecret }}, key: RABBITMQ_DEFAULT_USER } }
            - name: RABBITMQ_DEFAULT_PASS
              valueFrom: { secretKeyRef: { name: {{ .Values.existingSecret }}, key: RABBITMQ_DEFAULT_PASS } }
            - name: RABBITMQ_URL
              value: "amqp://$(RABBITMQ_DEFAULT_USER):$(RABBITMQ_DEFAULT_PASS)@rabbitmq:5672"
            - name: JWT_SECRET
              valueFrom: { secretKeyRef: { name: {{ .Values.existingSecret }}, key: JWT_SECRET } }
            - name: INTERNAL_SERVICE_TOKEN
              valueFrom: { secretKeyRef: { name: {{ .Values.existingSecret }}, key: INTERNAL_SERVICE_TOKEN } }
            - name: USER_SERVICE_URL
              value: "http://user-microservice:8080"
            - name: CORS_ALLOWED_ORIGINS
              valueFrom: { secretKeyRef: { name: {{ .Values.existingSecret }}, key: CORS_ALLOWED_ORIGINS } }
          resources:
            requests: { memory: {{ $svc.resources.requests.memory }} }
            limits: { memory: {{ $svc.resources.limits.memory }} }
          readinessProbe:
            httpGet: { path: /health/ready, port: 4300 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: 4300 }
            initialDelaySeconds: 15
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: gate-microservice
  namespace: {{ .Values.namespace }}
spec:
  selector: { app: gate-microservice }
  ports:
    - port: 4300
