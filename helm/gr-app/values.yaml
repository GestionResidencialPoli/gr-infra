namespace: gr-app
existingSecret: gr-app-secrets

image:
  registry: ghcr.io/gestionresidencialpoli

placement:
  backend:
    nodeSelector: {}
  frontend:
    nodeSelector: {}

postgres:
  image:
    repository: postgres
    tag: "16-alpine"
  storage: 2Gi
  resources:
    requests: { memory: 96Mi }
    limits: { memory: 160Mi }

redis:
  image:
    repository: redis
    tag: "7-alpine"
  resources:
    requests: { memory: 32Mi }
    limits: { memory: 80Mi }

rabbitmq:
  image:
    repository: rabbitmq
    tag: "3.13-alpine"
  resources:
    requests: { memory: 150Mi }
    limits: { memory: 256Mi }

user-microservice:
  replicas: 1
  image:
    tag: latest
  resources:
    requests: { memory: 256Mi }
    limits: { memory: 420Mi }

wall-microservice:
  replicas: 1
  image:
    tag: latest
  resources:
    requests: { memory: 80Mi }
    limits: { memory: 150Mi }

booking-microservice:
  replicas: 1
  image:
    tag: latest
  resources:
    requests: { memory: 64Mi }
    limits: { memory: 160Mi }

gate-microservice:
  replicas: 1
  image:
    tag: latest
  resources:
    requests: { memory: 64Mi }
    limits: { memory: 160Mi }

contact-microservice:
  replicas: 1
  image:
    tag: latest
  resources:
    requests: { memory: 64Mi }
    limits: { memory: 160Mi }

billing-microservice:
  replicas: 1
  image:
    tag: latest
  resources:
    requests: { memory: 64Mi }
    limits: { memory: 180Mi }

gateway:
  replicas: 1
  image:
    tag: latest
  resources:
    requests: { memory: 80Mi }
    limits: { memory: 150Mi }
  ingress:
    host: api.residencialpoli.online

uis:
  enabled: false
  replicas: 1
  image:
    registry: ""
    tag: local
    pullPolicy: Never
  ingress:
    domain: gr.local
  resources:
    requests: { memory: 64Mi }
    limits: { memory: 200Mi }
  services:
    common-ui: { port: 3000 }
    admin-ui: { port: 3001 }
    auth-ui: { port: 3002 }
    wall-ui: { port: 3003 }
    booking-ui: { port: 3004 }
    gate-ui: { port: 3005 }
    public-ui: { port: 3006 }
    billing-ui: { port: 3007 }
