namespace: gr-app
existingSecret: gr-app-secrets

image:
  registry: ghcr.io/gestionresidencialpoli

postgres:
  image:
    repository: postgres
    tag: "16-alpine"
  storage: 2Gi
  resources:
    requests: { memory: 96Mi }
    limits: { memory: 160Mi }

redis:
  image:
    repository: redis
    tag: "7-alpine"
  resources:
    requests: { memory: 32Mi }
    limits: { memory: 80Mi }

rabbitmq:
  image:
    repository: rabbitmq
    tag: "4-alpine"
  resources:
    requests: { memory: 150Mi }
    limits: { memory: 256Mi }

user-microservice:
  image:
    tag: latest
  resources:
    requests: { memory: 256Mi }
    limits: { memory: 420Mi }

wall-microservice:
  image:
    tag: latest
  resources:
    requests: { memory: 80Mi }
    limits: { memory: 150Mi }

wallMigrate:
  image:
    tag: migrate-latest

gateway:
  image:
    tag: latest
  resources:
    requests: { memory: 80Mi }
    limits: { memory: 150Mi }
  ingress:
    host: api.residencialpoli.online
