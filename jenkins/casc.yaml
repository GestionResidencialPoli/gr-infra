# Configuracion de Jenkins como codigo (plugin configuration-as-code).
# Las variables ${...} las entrega host/jenkins/docker-compose.yml desde un .env
# local que nunca se versiona.
jenkins:
  systemMessage: "Despliegue de Gestion Residencial Poli (gr-infra)"
  numExecutors: 1
  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: "admin"
          password: "${JENKINS_ADMIN_PASSWORD}"
  authorizationStrategy:
    loggedInUsersCanDoAnything:
      allowAnonymousRead: false

unclassified:
  location:
    url: "https://ci.residencialpoli.online/"

credentials:
  system:
    domainCredentials:
      - credentials:
          - string:
              scope: GLOBAL
              id: "gr-deploy-webhook-token"
              description: "Token del webhook GitHub Actions -> Jenkins"
              secret: "${WEBHOOK_TOKEN}"

jobs:
  - script: >
      pipelineJob('gr-deploy') {
        description('Despliega un servicio de gr-app con Helm. Lo dispara el webhook de GitHub Actions.')
        definition {
          cpsScm {
            scm {
              git {
                remote { url('https://github.com/GestionResidencialPoli/gr-infra.git') }
                branches('*/main')
              }
            }
            scriptPath('Jenkinsfile')
            lightweight(true)
          }
        }
      }
      // Una primera ejecucion registra el trigger declarado en el Jenkinsfile.
      queue('gr-deploy')
