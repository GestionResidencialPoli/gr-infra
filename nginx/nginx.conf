worker_processes auto;

events {
    worker_connections 1024;
}

http {
    access_log /dev/stdout;
    error_log /dev/stderr warn;

    sendfile on;
    server_tokens off;
    client_max_body_size 10m;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        "" "";
    }

    upstream gateway {
        server gateway:4000;
        keepalive 16;
    }

    server {
        listen 3000;
        server_name _;

        include /etc/nginx/gr/backend-locations.conf;

        location / {
            proxy_pass http://common-ui:3000;
            include /etc/nginx/gr/frontend-proxy.conf;
        }
    }

    server {
        listen 3001;
        server_name _;

        include /etc/nginx/gr/backend-locations.conf;

        location / {
            proxy_pass http://admin-ui:3001;
            include /etc/nginx/gr/frontend-proxy.conf;
