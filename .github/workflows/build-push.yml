name: Build y publicar imagen

on:
  workflow_call:
    inputs:
      service-name:
        description: "Nombre del repo/imagen (ej. gr-wall-microservice), usado como tag en GHCR"
        required: true
        type: string
      compose-service:
        description: "Clave del servicio en docker-compose.yml de gr-infra (ej. wall-microservice)"
        required: true
        type: string
      migrate-target:
        description: "Si el Dockerfile tiene un stage 'migrate' que tambien hay que publicar"
        required: false
        type: boolean
        default: false
      build-args:
        description: "Build args del runtime, uno por linea (KEY=valor). Las UIs de Next.js incrustan aqui las URLs publicas."
        required: false
        type: string
        default: ""
      public-urls:
        description: "Añade las URLs publicas de produccion de todas las UIs (NEXT_PUBLIC_*_UI_URL) a los build args. Next.js las incrusta al compilar."
        required: false
        type: boolean
        default: false
    secrets:
      JENKINS_WEBHOOK_URL:
        required: true
      JENKINS_WEBHOOK_TOKEN:
        required: true

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Preparar build args
        id: args
        env:
          BUILD_ARGS: ${{ inputs.build-args }}
          PUBLIC_URLS: ${{ inputs.public-urls }}
        run: |
          {
            echo 'value<<__ARGS__'
            printf '%s\n' "$BUILD_ARGS" | sed '/^[[:space:]]*$/d'
            if [ "$PUBLIC_URLS" = "true" ]; then
              echo NEXT_PUBLIC_AUTH_UI_URL=https://auth.residencialpoli.online
              echo NEXT_PUBLIC_COMMON_UI_URL=https://app.residencialpoli.online
              echo NEXT_PUBLIC_ADMIN_UI_URL=https://admin.residencialpoli.online
              echo NEXT_PUBLIC_WALL_UI_URL=https://muro.residencialpoli.online
              echo NEXT_PUBLIC_BOOKING_UI_URL=https://reservas.residencialpoli.online
              echo NEXT_PUBLIC_GATE_UI_URL=https://porteria.residencialpoli.online
              echo NEXT_PUBLIC_BILLING_UI_URL=https://finanzas.residencialpoli.online
            fi
            echo '__ARGS__'
          } >> "$GITHUB_OUTPUT"

      - name: Build y push (runtime)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: ${{ steps.args.outputs.value }}
          tags: |
            ghcr.io/gestionresidencialpoli/${{ inputs.service-name }}:latest
            ghcr.io/gestionresidencialpoli/${{ inputs.service-name }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build y push (migrate)
        if: inputs.migrate-target
        uses: docker/build-push-action@v6
        with:
          context: .
          target: migrate
          push: true
          tags: |
            ghcr.io/gestionresidencialpoli/${{ inputs.service-name }}:migrate-latest
            ghcr.io/gestionresidencialpoli/${{ inputs.service-name }}:migrate-sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Avisar a Jenkins para desplegar
        continue-on-error: true
        run: |
          curl -sf -X POST "${{ secrets.JENKINS_WEBHOOK_URL }}?token=${{ secrets.JENKINS_WEBHOOK_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "{\"service\":\"${{ inputs.compose-service }}\",\"tag\":\"${{ github.sha }}\",\"migrate\":${{ inputs.migrate-target }}}"
