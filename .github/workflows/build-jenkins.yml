name: Build y publicar imagen de Jenkins

on:
  push:
    branches: [main]
    paths:
      - "jenkins/**"
      - ".github/workflows/build-jenkins.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: jenkins
          push: true
          tags: |
            ghcr.io/gestionresidencialpoli/gr-jenkins:latest
            ghcr.io/gestionresidencialpoli/gr-jenkins:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
